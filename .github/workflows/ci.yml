name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Compile and test backend
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Frontend / quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: "10"

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build production frontend
        run: pnpm build

  configuration:
    name: Configuration / validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate development Compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production Compose file
        run: >-
          docker compose
          --env-file deploy/.env.prod.example
          -f docker-compose.prod.yml
          config --quiet

      - name: Validate server deployment Compose file
        run: >-
          docker compose
          --env-file deploy/.env.prod.example
          --env-file deploy/server/release.env.example
          -f deploy/server/docker-compose.yml
          config --quiet

      - name: Validate server deployment script syntax
        run: bash -n deploy/server/deploy.sh

      - name: Test release record validation and metadata image
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          TEST_RELEASE_DOCKER: '1'
        run: python3 -m unittest discover -s deploy/ci/tests -v

      - name: Test pull agent and deployment safety with fake Docker
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s deploy/server/tests -v

      - name: Validate pull timer units
        run: systemd-analyze verify deploy/server/systemd/tech-request-cd.service deploy/server/systemd/tech-request-cd.timer

      - name: Enforce deployment safety invariants
        shell: bash
        run: |
          set -euo pipefail
          if grep -En 'http://localhost(:[0-9]+)?/actuator/health' \
            docker-compose.prod.yml deploy/server/docker-compose.yml; then
            echo "Production health checks must use 127.0.0.1, not localhost." >&2
            exit 1
          fi
          grep -F 'http://127.0.0.1:8080/actuator/health' docker-compose.prod.yml
          grep -F 'http://127.0.0.1/actuator/health' docker-compose.prod.yml
          grep -F 'http://127.0.0.1:8080/actuator/health' deploy/server/docker-compose.yml
          grep -F 'http://127.0.0.1/actuator/health' deploy/server/docker-compose.yml
          grep -F 'readonly BACKUP_DIR="/data/volumes/tech-request-prod/backups"' deploy/server/deploy.sh
          grep -F -- '--project-directory "${DEPLOY_DIR}"' deploy/server/deploy.sh
          grep -F 'cd -- "${DEPLOY_DIR}"' deploy/server/deploy.sh
