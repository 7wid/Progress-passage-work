spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS_ENABLED:true}
      "[mail.smtp.starttls.required]": ${SMTP_STARTTLS_ENABLED:true}
      "[mail.smtp.ssl.enable]": ${SMTP_SSL_ENABLED:false}
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  application:
    name: tech-request-backend
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  session:
    store-type: jdbc
    timeout: 8h
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  health:
    # SMTP is optional; an upstream mail outage must not restart the entire application.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  password-recovery:
    enabled: ${APP_PASSWORD_RECOVERY_ENABLED:false}
    from: ${APP_PASSWORD_RECOVERY_FROM:}
    reset-url: ${APP_PASSWORD_RECOVERY_RESET_URL:}
    token-ttl: ${APP_PASSWORD_RECOVERY_TOKEN_TTL:15m}
  web-origins:
    - http://localhost:5173
  upload-dir: ./data/uploads
  max-file-size-bytes: 20971520
  max-file-count: 5
  pending-attachment-retention: 24h
  registration:
    enabled: true
    email-suffix: ""
  login-security:
    max-failed-attempts: 5
    lock-duration: 15m
