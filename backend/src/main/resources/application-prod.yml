server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        http-only: true
        same-site: lax

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

logging:
  file:
    name: ${APP_LOG_FILE:./logs/tech-request-backend.log}
  level:
    root: INFO
    cn.edu.techgroup.outsourcing: INFO
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 2GB
      clean-history-on-start: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:false}
    email-suffix: ${APP_REGISTRATION_EMAIL_SUFFIX:}
  bootstrap-admin:
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:false}
    account: ${APP_BOOTSTRAP_ADMIN_ACCOUNT:admin}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${APP_BOOTSTRAP_ADMIN_DISPLAY_NAME:系统管理员}
