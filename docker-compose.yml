name: tech-request-dev

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    init: true
    environment:
      MYSQL_DATABASE: tech_request
      MYSQL_USER: tech_request
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-root-local}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
